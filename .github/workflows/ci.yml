name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # go vet does not check formatting, and gofmt -l exits 0 even when it
      # lists files — so test the output explicitly.
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # staticcheck is pinned as a tool directive in go.mod.
      - name: Lint
        run: go tool staticcheck ./...

      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      # -race needs cgo, which is why it runs here and not in the local loop.
      - name: Test
        run: go test -race ./...

      # A ratchet, not a target. Raise COVER_FLOOR only after the suite clears
      # the new level. Keep it in step with the verification loop in AGENTS.md.
      #
      # ./cmd/... is excluded: those are argv-to-library wiring with no
      # behaviour of their own, and a test rig's main() dragging the floor
      # down would only invite lowering it.
      - name: Coverage floor
        env:
          COVER_FLOOR: "80.0"
        run: |
          go test -coverprofile=coverage.out . ./internal/... > /dev/null
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "coverage ${total}% (floor ${COVER_FLOOR}%)"
          awk -v t="$total" -v f="$COVER_FLOOR" 'BEGIN { if (t+0 < f+0) { print "below the floor"; exit 1 } }'

  # This runs on Raspberry Pis with the device on USB, plus an x86 dev box.
  # Linux only — no Windows, no macOS. The Pi arm variants are all built
  # because a Pi 5 is arm64, a 32-bit Pi OS on a 3/4 is armv7, and a Pi 1 or
  # Zero is armv6. Cheap while the code is pure Go.
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
          - goarch: arm
            goarm: "7"
          - goarch: arm
            goarm: "6"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build linux/${{ matrix.goarch }}${{ matrix.goarm }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build ./...
